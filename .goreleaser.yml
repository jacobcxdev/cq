version: 2

builds:
  - id: cq
    main: ./cmd/cq
    binary: cq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.geminiOAuthClientSecret={{ .Env.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
      - -X github.com/jacobcxdev/cq/internal/proxy.codexStage11CorpusBuildProvenanceSHA256={{ .Env.CODEX_STAGE11_PROVENANCE_SHA256 }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cq
    ids: [cq]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - repository:
      owner: jacobcxdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: cq
    ids: [cq]
    directory: Casks
    homepage: "https://github.com/jacobcxdev/cq"
    description: "CLI tool to check AI provider quota usage"
    license: "MIT"
    skip_upload: true
    binaries:
      - cq
    custom_block: |
      cq_lifecycle_script = <<~'SH'
        #!/bin/bash
        set -euo pipefail
        action=$1
        source=$2
        target=$3
        if [[ "$action" == install ]]; then
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            /usr/bin/xattr -d com.apple.quarantine "$source"
          fi
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            echo "cq remains quarantined after installation" >&2
            exit 1
          fi
          # An older uninstall hook may return before launchd finishes bootout.
          quiet=0
          for attempt in {1..300}; do
            if ! /bin/launchctl print "gui/$UID/dev.jacobcx.cq.proxy" >/dev/null 2>&1 &&
               ! /bin/launchctl print "gui/$UID/dev.jacobcx.cq.refresh" >/dev/null 2>&1; then
              quiet=$((quiet + 1))
              if [[ "$quiet" == 10 ]]; then
                break
              fi
            else
              quiet=0
            fi
            if [[ "$attempt" == 300 ]]; then
              echo "CQ service remains registered after uninstall; upgrade cannot continue" >&2
              exit 1
            fi
            sleep 0.1
          done
          linked=0
          if [[ -e "$target" || -L "$target" ]]; then
            if [[ ! -L "$target" || ! "$target" -ef "$source" ]]; then
              echo "refusing to replace existing CQ executable: $target" >&2
              exit 1
            fi
          else
            /bin/ln -s "$source" "$target"
            linked=1
          fi
          if ! "$source" service install --owner=homebrew "--service-executable=$target"; then
            if [[ "$linked" == 1 && -L "$target" && "$target" -ef "$source" ]]; then
              /bin/rm "$target"
            fi
            exit 1
          fi
        elif [[ "$action" == uninstall ]]; then
          uninstalled=0
          if [[ -x "$source" && "$target" -ef "$source" ]]; then
            "$source" service uninstall --owner=homebrew "--service-executable=$target"
            uninstalled=1
          elif [[ -e "$target" || -L "$target" ]]; then
            if [[ ! -L "$target" || "$(readlink "$target")" != "$source" ]]; then
              echo "refusing to uninstall a different CQ executable: $target" >&2
              exit 1
            fi
          fi
          if [[ "$uninstalled" == 0 ]]; then
            /bin/launchctl bootout "gui/$UID/dev.jacobcx.cq.proxy" >/dev/null 2>&1 || true
            /bin/launchctl bootout "gui/$UID/dev.jacobcx.cq.refresh" >/dev/null 2>&1 || true
            /bin/rm -f "$HOME/Library/LaunchAgents/dev.jacobcx.cq.proxy.plist" \
                       "$HOME/Library/LaunchAgents/dev.jacobcx.cq.refresh.plist"
          fi
        else
          echo "unknown Homebrew lifecycle action: $action" >&2
          exit 64
        fi
      SH
      installer script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "install",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }
      uninstall script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "uninstall",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }
      # Scope the compatibility bridge to this cask artifact instance.
      cq_uninstall = cask.artifacts.find { |artifact| artifact.is_a?(::Cask::Artifact::Uninstall) }
      cq_parameters = cq_uninstall.method(:uninstall_phase).parameters.map(&:last)
      unless %i[command successor reinstall].all? { |parameter| cq_parameters.include?(parameter) }
        raise "CQ upgrade requires a supported Homebrew uninstall callback"
      end
      cq_uninstall.singleton_class.prepend(Module.new do
        def uninstall_phase(command:, successor: nil, reinstall: false, **kwargs)
          return if successor && successor.token == cask.token
          if reinstall
            raise "CQ reinstall requires a same-token Homebrew successor"
          end

          super(command: command, successor: successor, reinstall: reinstall, **kwargs)
        end
      end)
