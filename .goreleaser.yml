version: 2

git:
  ignore_tags:
    - "cq-native-stage-*"
    - "cq-network-*"

builds:
  - id: cq
    main: ./cmd/cq
    binary: cq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.geminiOAuthClientSecret={{ .Env.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
      - -X github.com/jacobcxdev/cq/internal/proxy.codexStage11CorpusBuildProvenanceSHA256={{ .Env.CODEX_STAGE11_PROVENANCE_SHA256 }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cq
    ids: [cq]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./internal/provider/zai/zcode/third_party/zcode/LICENSE
      name_template: ZCode-LICENSE.txt

release:
  draft: true
  target_commitish: "{{ .FullCommit }}"
  use_existing_draft: true
  replace_existing_artifacts: true
  extra_files:
    - glob: ./internal/provider/zai/zcode/third_party/zcode/LICENSE
      name_template: ZCode-LICENSE.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - repository:
      owner: jacobcxdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: cq
    ids: [cq]
    directory: Casks
    homepage: "https://github.com/jacobcxdev/cq"
    description: "CLI tool to check AI provider quota usage"
    license: "MIT"
    skip_upload: true
    binaries:
      - cq
    custom_block: |
      on_ventura :or_newer do
        depends_on cask: "jacobcxdev/tap/cq-network"
      end

      cq_lifecycle_script = <<~'SH'
        #!/bin/bash
        set -euo pipefail
        action=$1
        source=$2
        target=$3
        if [[ "$action" == install ]]; then
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            /usr/bin/xattr -d com.apple.quarantine "$source"
          fi
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            echo "cq remains quarantined after installation" >&2
            exit 1
          fi
          linked=0
          if [[ -e "$target" || -L "$target" ]]; then
            if [[ ! -L "$target" || ! "$target" -ef "$source" ]]; then
              echo "refusing to replace existing CQ executable: $target" >&2
              exit 1
            fi
          else
            /bin/ln -s "$source" "$target"
            linked=1
          fi
          if ! "$source" service install --owner=homebrew "--service-executable=$target"; then
            if [[ "$linked" == 1 && -L "$target" && "$target" -ef "$source" ]]; then
              /bin/rm "$target"
            fi
            exit 1
          fi
        elif [[ "$action" == uninstall ]]; then
          if [[ ! -x "$source" || ! "$target" -ef "$source" ]]; then
            echo "CQ removal requires its verified package executable: $source" >&2
            exit 1
          fi
          "$source" service uninstall --owner=homebrew "--service-executable=$target"
        else
          echo "unknown Homebrew lifecycle action: $action" >&2
          exit 64
        fi
      SH
      installer script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "install",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }
      uninstall(script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "uninstall",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }).tap do
        cask = self.cask
        # Keep callback setup attached to its declaration through formatting.
        # Saved Ruby metadata retains this instance-scoped compatibility bridge.
        unless cask.method(:uninstall_flight_blocks?).arity == 0
          raise "CQ upgrade requires supported Homebrew metadata persistence"
        end
        cask.define_singleton_method(:uninstall_flight_blocks?) { true }
        cq_uninstall = cask.artifacts.find { |artifact| artifact.is_a?(::Cask::Artifact::Uninstall) }
        cq_parameters = cq_uninstall.method(:uninstall_phase).parameters.map(&:last)
        unless %i[command successor reinstall].all? { |parameter| cq_parameters.include?(parameter) }
          raise "CQ upgrade requires a supported Homebrew uninstall callback"
        end
        if cq_uninstall.respond_to?(:dispatch_uninstall_directive)
          cq_parameters = cq_uninstall.method(:dispatch_uninstall_directive).parameters.map(&:last)
          unless %i[command successor].all? { |parameter| cq_parameters.include?(parameter) }
            raise "CQ upgrade requires a supported Homebrew uninstall callback"
          end
        end
        cq_uninstall.singleton_class.prepend(Module.new do
          # Newer Homebrew groups directives without calling uninstall_phase.
          define_method(:dispatch_uninstall_directive) do |directive, command:, successor: nil, **kwargs|
            return if successor && successor.token == cask.token

            super(directive, command: command, successor: successor, **kwargs) # rubocop:disable Style/SuperArguments
          end

          define_method(:uninstall_phase) do |command:, successor: nil, reinstall: false, **kwargs|
            return if successor && successor.token == cask.token
            if reinstall
              raise "CQ reinstall requires a same-token Homebrew successor"
            end

            # define_method requires explicit argument forwarding to super.
            super(command: command, successor: successor, reinstall: reinstall, **kwargs) # rubocop:disable Style/SuperArguments
          end
        end)
        # Homebrew's reinstall normally purges its predecessor without a backup.
        # Use its existing upgrade transaction for this exact CQ cask instance.
        require "cask/installer"
        unless %i[install uninstall_existing_cask].all? { |method| ::Cask::Installer.instance_method(method).arity == 0 }
          raise "CQ reinstall requires supported Homebrew installer callbacks"
        end
        require "cask/upgrade"
        cq_dependency_callbacks = [:satisfy_cask_and_formula_dependencies, :cask_and_formula_dependencies]
        unless cq_dependency_callbacks.all? { |method| ::Cask::Installer.instance_method(method).arity.zero? }
          raise "CQ companion reconciliation requires supported Homebrew dependency callbacks"
        end
        cq_upgrade_parameters = ::Cask::Upgrade.method(:upgrade_cask).parameters.map(&:last)
        cq_required_parameters = [
          :old_cask, :new_cask, :binaries, :force, :require_sha, :quit,
          :skip_cask_deps, :verbose, :download_queue, :new_cask_installer,
        ]
        unless cq_required_parameters.all? { |parameter| cq_upgrade_parameters.include?(parameter) }
          raise "CQ companion reconciliation requires a supported Homebrew upgrade transaction"
        end
        cq_cask = cask
        ::Cask::Installer.prepend(Module.new do
          define_method(:satisfy_cask_and_formula_dependencies) do
            return super() unless @cask.equal?(cq_cask)
            return super() unless @cask.depends_on.cask.include?("jacobcxdev/tap/cq-network")

            # Homebrew considers any installed Cask dependency satisfied. Bind
            # this one companion to the immutable release selected by CQ.
            pin = JSON.parse(<<~'JSON')
              {{ .Env.CQ_NATIVE_NETWORK_PIN }}
            JSON
            version = pin.fetch("version")
            sha256 = pin.fetch("sha256")
            schema = pin["schema_version"]
            native_tag = schema == 2 ? "v#{version}" : "cq-network-v#{version}"
            url = "https://github.com/jacobcxdev/cq/releases/download/#{native_tag}/CQNetwork_#{version}_universal.zip"
            valid_bundles = true
            if pin.key?("bundles")
              bundles = pin["bundles"]
              valid_bundles = schema == 2 && version == @cask.version.to_s &&
                              bundles.is_a?(Hash) && bundles.keys.sort == %w[amd64 arm64] &&
                              bundles.all? do |architecture, bundle|
                                expected_url = "https://github.com/jacobcxdev/cq/releases/download/v#{version}/cq_#{version}_darwin_#{architecture}_bundle.tar.gz"
                                bundle.is_a?(Hash) && bundle.keys.sort == %w[sha256 url] &&
                                  bundle["url"] == expected_url &&
                                  bundle["sha256"].is_a?(String) && bundle["sha256"].match?(/\A[0-9a-f]{64}\z/)
                              end
              if valid_bundles
                architecture = Homebrew::SimulateSystem.current_arch == :arm ? "arm64" : "amd64"
                bundle = bundles.fetch(architecture)
                sha256 = bundle.fetch("sha256")
                url = bundle.fetch("url")
              end
            end
            companion = cask_and_formula_dependencies.find do |dependency|
              dependency.is_a?(::Cask::Cask) && dependency.token == "cq-network"
            end
            valid_pin = [1, 2].include?(schema) && valid_bundles &&
                        version.is_a?(String) && version.match?(/\A\d+\.\d+\.\d+\z/) &&
                        sha256.is_a?(String) && sha256.match?(/\A[0-9a-f]{64}\z/) &&
                        companion && companion.version.to_s == version &&
                        companion.sha256.to_s == sha256 && companion.url.to_s == url
            unless valid_pin
              raise "CQ Network dependency does not match CQ's reviewed companion release"
            end
            return super() unless companion.installed?

            installed = ::Cask::CaskLoader.load_from_installed_caskfile(companion.installed_caskfile, api_fallback: false)
            return super() if installed.version.to_s == version
            raise "CQ Network is pinned; unpin it before upgrading CQ" if companion.pinned?
            if Version.new(installed.version.to_s) > Version.new(version)
              raise "Installed CQ Network is newer than CQ's reviewed companion release"
            end

            # This runs during dependency installation, before CQ's old binary
            # is unlinked. It is never evaluated by info, audit, or brew fetch.
            # Older companion receipts disable routing during their uninstall;
            # retain only a validated opt-in and restore it after the transaction.
            agent = Pathname(Dir.home)/"Library/LaunchAgents/dev.jacobcx.cq.network.plist"
            restore_routing = agent.exist? || agent.symlink?
            if restore_routing
              stat = agent.lstat
              private_agent = stat.file? && stat.uid == Process.uid &&
                              stat.mode & 0o777 == 0o600 && stat.size <= 1_048_576
              unless private_agent
                raise "CQ Network LaunchAgent must be a private user-owned regular file"
              end
              result = @command.run("/usr/bin/plutil",
                                    args: ["-convert", "json", "-o", "-", agent.to_s], must_succeed: true)
              definition = JSON.parse(result.stdout)
              arguments = definition["ProgramArguments"]
              expected = ["/Applications/CQNetwork.app/Contents/MacOS/CQNetwork", "run", "--cq"]
              valid_agent = definition["Label"] == "dev.jacobcx.cq.network" &&
                            arguments.is_a?(Array) && arguments.length == 4 && arguments.take(3) == expected &&
                            arguments.last.is_a?(String) && arguments.last.start_with?("/")
              unless valid_agent
                raise "CQ Network LaunchAgent has an unexpected definition"
              end
            end
            executable = HOMEBREW_PREFIX/"bin/cq"
            if restore_routing && (!executable.file? || !executable.executable?)
              raise "CQ Network routing restoration requires the installed CQ executable"
            end

            failure = nil
            begin
              successor = self.class.new(companion, command: @command, upgrade: true, require_sha: true,
                                         skip_cask_deps: true, download_queue: @download_queue)
              ::Cask::Upgrade.upgrade_cask(installed, companion,
                                        binaries: binaries?, force: false, require_sha: true, quit: false,
                                        skip_cask_deps: true, verbose: verbose?, download_queue: @download_queue,
                                        new_cask_installer: successor)
            rescue => error
              failure = error
            end
            if restore_routing
              begin
                @command.run(executable.to_s, args: ["codex", "network", "enable"], must_succeed: true)
              rescue => error
                detail = failure ? " (companion upgrade also failed: #{failure})" : ""
                raise "CQ Network routing restoration failed: #{error}#{detail}"
              end
            end
            raise failure if failure

            super()
          end

          define_method(:uninstall_existing_cask) do
            return super() unless @cask.equal?(cq_cask)
            return unless @cask.installed?

            installed = ::Cask::CaskLoader.load_from_installed_caskfile(@cask.installed_caskfile, api_fallback: false)
            @cq_reinstall_predecessor = self.class.new(installed, command: @command, verbose: verbose?, upgrade: true)
            @cq_reinstall_predecessor.start_upgrade(successor: @cask)
          end

          define_method(:install) do
            return super() unless @cask.equal?(cq_cask)
            return super() unless reinstall?

            begin
              super()
            rescue
              @cq_reinstall_predecessor&.revert_upgrade(predecessor: @cask)
              raise
            else
              @cq_reinstall_predecessor&.finalize_upgrade
            ensure
              @cq_reinstall_predecessor = nil
            end
          end
        end)
      end
