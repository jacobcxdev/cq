version: 2

builds:
  - id: cq
    main: ./cmd/cq
    binary: cq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.geminiOAuthClientSecret={{ .Env.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
      - -X github.com/jacobcxdev/cq/internal/proxy.codexStage11CorpusBuildProvenanceSHA256={{ .Env.CODEX_STAGE11_PROVENANCE_SHA256 }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: cq-install
    main: ./cmd/cq-install
    binary: cq-install
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cq
    ids: [cq]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: cq-install
    ids: [cq-install]
    formats: [binary]
    name_template: "cq-install_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [cq]
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        wait: true
        timeout: 20m

checksum:
  name_template: "checksums.txt"

release:
  draft: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - repository:
      owner: jacobcxdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: cq
    ids: [cq]
    directory: Casks
    homepage: "https://github.com/jacobcxdev/cq"
    description: "CLI tool to check AI provider quota usage"
    license: "MIT"
    binaries:
      - cq
    hooks:
      pre:
        uninstall: |
          system_command "#{HOMEBREW_PREFIX}/bin/cq", args: ["service", "uninstall", "--owner=homebrew", "--service-executable=#{HOMEBREW_PREFIX}/bin/cq"]
      post:
        install: |
          system_command "#{HOMEBREW_PREFIX}/bin/cq", args: ["service", "install", "--owner=homebrew", "--service-executable=#{HOMEBREW_PREFIX}/bin/cq"]
    uninstall:
      launchctl:
        - dev.jacobcx.cq.proxy
        - dev.jacobcx.cq.refresh
      delete:
        - ~/Library/LaunchAgents/dev.jacobcx.cq.proxy.plist
        - ~/Library/LaunchAgents/dev.jacobcx.cq.refresh.plist
