version: 2

builds:
  - id: cq
    main: ./cmd/cq
    binary: cq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.geminiOAuthClientSecret={{ .Env.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
      - -X github.com/jacobcxdev/cq/internal/proxy.codexStage11CorpusBuildProvenanceSHA256={{ .Env.CODEX_STAGE11_PROVENANCE_SHA256 }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cq
    ids: [cq]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - repository:
      owner: jacobcxdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: cq
    ids: [cq]
    directory: Casks
    homepage: "https://github.com/jacobcxdev/cq"
    description: "CLI tool to check AI provider quota usage"
    license: "MIT"
    skip_upload: true
    binaries:
      - cq
    custom_block: |
      cq_lifecycle_script = <<~'SH'
        #!/bin/bash
        set -euo pipefail
        action=$1
        source=$2
        target=$3
        if [[ "$action" == install ]]; then
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            /usr/bin/xattr -d com.apple.quarantine "$source"
          fi
          attributes=$(/usr/bin/xattr "$source")
          if grep -Fxq com.apple.quarantine <<<"$attributes"; then
            echo "cq remains quarantined after installation" >&2
            exit 1
          fi
          linked=0
          if [[ -e "$target" || -L "$target" ]]; then
            if [[ ! -L "$target" || ! "$target" -ef "$source" ]]; then
              echo "refusing to replace existing CQ executable: $target" >&2
              exit 1
            fi
          else
            /bin/ln -s "$source" "$target"
            linked=1
          fi
          if ! "$source" service install --owner=homebrew "--service-executable=$target"; then
            if [[ "$linked" == 1 && -L "$target" && "$target" -ef "$source" ]]; then
              /bin/rm "$target"
            fi
            exit 1
          fi
        elif [[ "$action" == uninstall ]]; then
          if [[ ! -x "$source" || ! "$target" -ef "$source" ]]; then
            echo "CQ removal requires its verified package executable: $source" >&2
            exit 1
          fi
          "$source" service uninstall --owner=homebrew "--service-executable=$target"
        else
          echo "unknown Homebrew lifecycle action: $action" >&2
          exit 64
        fi
      SH
      installer script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "install",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }
      uninstall(script: {
        executable: "/bin/bash",
        args: [
          "-c", cq_lifecycle_script, "cq-homebrew-lifecycle", "uninstall",
          "#{HOMEBREW_CASKROOM}/#{token}/{{ .Version }}/cq", "#{HOMEBREW_PREFIX}/bin/cq",
        ],
      }).tap do
        # Keep callback setup attached to its declaration through formatting.
        # Saved Ruby metadata retains this instance-scoped compatibility bridge.
        unless cask.method(:uninstall_flight_blocks?).arity == 0
          raise "CQ upgrade requires supported Homebrew metadata persistence"
        end
        cask.define_singleton_method(:uninstall_flight_blocks?) { true }
        cq_uninstall = cask.artifacts.find { |artifact| artifact.is_a?(::Cask::Artifact::Uninstall) }
        cq_parameters = cq_uninstall.method(:uninstall_phase).parameters.map(&:last)
        unless %i[command successor reinstall].all? { |parameter| cq_parameters.include?(parameter) }
          raise "CQ upgrade requires a supported Homebrew uninstall callback"
        end
        cq_uninstall.singleton_class.prepend(Module.new do
          define_method(:uninstall_phase) do |command:, successor: nil, reinstall: false, **kwargs|
            return if successor && successor.token == cask.token
            if reinstall
              raise "CQ reinstall requires a same-token Homebrew successor"
            end

            # define_method requires explicit argument forwarding to super.
            super(command: command, successor: successor, reinstall: reinstall, **kwargs) # rubocop:disable Style/SuperArguments
          end
        end)
      end
