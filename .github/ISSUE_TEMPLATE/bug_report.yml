name: Bug report
description: Report a CQ failure with minimal, reviewed diagnostics.
labels: [bug, needs-triage]
assignees: [jacobcxdev]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [agent diagnostics and issue guide](https://github.com/jacobcxdev/cq/blob/main/docs/agent-issue-reporting.md).
        Reports without logs are welcome: explain what is unavailable. Do not change working accounts or rerun an unsafe action just to collect evidence.
        This issue and its attachments are public. Review and redact before pasting or selecting files; attachments upload immediately. Do not include credentials, full configuration, OAuth callback URLs, private prompts or raw payload logs. Arrange private handling for sensitive security reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did you expect, and what happened instead? Include the exact sanitised error.
      placeholder: "Expected: ...\nActual: ...\nImpact: ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CQ installed/active/pending versions, OS and architecture, installation method, client/build, provider/model and relevant integration/routing mode. Unknown is fine.
      placeholder: "CQ/package: ...\nActive/pending runtime: ...\nOS/architecture: ...\nInstaller: ...\nClient/build: ...\nProvider/model: ...\nIntegration/mode: ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and timing
      description: Minimal numbered steps, incident time with timezone, frequency and collection time. If intermittent or unsafe to reproduce, say so.
      placeholder: "1. ...\n2. ...\nIncident time/timezone: ...\nFrequency: ...\nCollection time: ..."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste reviewed status and the smallest matching trace/log excerpt, or explain why unavailable. Identify installed-client, candidate or synthetic evidence; note trace IDs, truncation and collection errors. Attach only files approved for public sharing.
      placeholder: "Evidence source: ...\nSanitised status/trace: ...\nMissing evidence: ...\nAttachments, time range and redactions: ..."
    validations:
      required: true
  - type: textarea
    id: cleanup
    attributes:
      label: Changes and cleanup
      description: What did you try? Did temporary metadata/payload capture return to its previous setting? List any pending restart or cleanup; no changes is a valid answer.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public sharing review
      options:
        - label: I reviewed the report and every attachment for credentials, private content and identifying information, and approve sharing them publicly.
          required: true
