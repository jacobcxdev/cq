name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  statuses: read

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledRescuePassesThroughCurrentClient)$'

  release:
    needs: validate-codex
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Require live Codex routing validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" |
            go run ./internal/tools/releasestatus --sha "${sha}"

      - name: Gate degraded rescue transport
        run: |
          test_name=TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport
          test_log="$RUNNER_TEMP/degraded-rescue-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run "^${test_name}$" >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"

      - name: Verify Codex Stage 11 corpus
        run: go test -race -count=1 ./internal/proxy -run '^(TestCodexStage11LifecycleCorpusUsesProductionHandlers|TestCodexStage11LifecycleCorpusSmoke|TestCodexStage11ReviewedManifestMatchesCorpusAuthority)$'

      - name: Bind reviewed Codex corpus provenance
        run: echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go "${GITHUB_REF_NAME#v}" ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)" >> "$GITHUB_ENV"

      - name: Verify Gemini OAuth client secret
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
        run: test -n "$GEMINI_ANTIGRAVITY_CLIENT_SECRET"

      - name: Build package validation snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}

      - name: Publish formatted Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cask="dist/homebrew/Casks/cq.rb"
          test -f "$cask"
          brew style --fix "$cask"
          brew style "$cask"

          endpoint="repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb"
          encoded="$(base64 <"$cask" | tr -d '\n')"
          current="$RUNNER_TEMP/cq-cask-current.json"
          if gh api "$endpoint" >"$current" 2>/dev/null; then
            current_content="$(jq -r '.content' "$current" | tr -d '\n')"
            if [ "$current_content" = "$encoded" ]; then
              echo "Homebrew Cask already current"
              exit 0
            fi
            current_sha="$(jq -r '.sha' "$current")"
            gh api --method PUT "$endpoint" \
              -f message="chore: updated cq ${RELEASE_TAG}" \
              -f content="$encoded" \
              -f sha="$current_sha"
          else
            gh api --method PUT "$endpoint" \
              -f message="chore: added cq ${RELEASE_TAG}" \
              -f content="$encoded"
          fi

      - name: Audit published Homebrew Cask
        run: |
          brew tap jacobcxdev/tap
          brew update
          brew audit --cask --strict jacobcxdev/tap/cq

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          tag_name="$(jq -r '.tag_name' <<<"${release}")"
          draft="$(jq -r '.draft' <<<"${release}")"
          body="$(jq -r '.body' <<<"${release}")"
          assets="$(jq '.assets | length' <<<"${release}")"
          test "${tag_name}" = "${RELEASE_TAG}"
          test "${draft}" = "false"
          grep -q '^## Changelog$' <<<"${body}"
          test "${assets}" -ge 7
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            verification_dir="${RUNNER_TEMP}/cq-darwin-${arch}"
            mkdir -p "${verification_dir}"
            archive="cq_${version}_darwin_${arch}.tar.gz"
            gh release download "${RELEASE_TAG}" --pattern "${archive}" --dir "${verification_dir}"
            tar -xzf "${verification_dir}/${archive}" -C "${verification_dir}"
            go version -m "${verification_dir}/cq" |
              grep -F "github.com/jacobcxdev/cq/cmd/cq"
          done

  windows-packages:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build and publish WinGet MSI assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $releaseRoot = Join-Path $env:RUNNER_TEMP "cq-release"
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern "cq_${version}_windows_*.zip" --pattern "checksums.txt" --dir $releaseRoot
          if ($LASTEXITCODE -ne 0) {
            throw "failed to download Windows release payload"
          }
          $checksums = Join-Path $releaseRoot "checksums.txt"
          dotnet tool install --tool-path $wixRoot wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "failed to install WiX 5.0.2"
          }
          $wix = Join-Path $wixRoot "wix.exe"
          $msiPaths = @()
          foreach ($architecture in @("amd64", "arm64")) {
            $archiveName = "cq_${version}_windows_${architecture}.zip"
            $archive = Join-Path $releaseRoot $archiveName
            $checksumLine = @(Get-Content -LiteralPath $checksums | Where-Object { $_ -match ("  " + [regex]::Escape($archiveName) + '$') })
            if ($checksumLine.Count -ne 1) {
              throw "release checksum is absent or ambiguous for $archiveName"
            }
            $expected = ($checksumLine[0] -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "release checksum differs for $archiveName"
            }
            $payloadRoot = Join-Path $releaseRoot $architecture
            Expand-Archive -LiteralPath $archive -DestinationPath $payloadRoot
            $payload = @(Get-ChildItem -LiteralPath $payloadRoot -Force)
            if ($payload.Count -ne 1 -or $payload[0].Name -ne "cq.exe") {
              throw "Windows release archive has unexpected payload"
            }
            $reportedVersion = (& $payload[0].FullName --version).TrimStart("v")
            if ($reportedVersion -ne $version) {
              throw "Windows release binary version differs"
            }
            $msi = Join-Path $releaseRoot "cq_${version}_windows_${architecture}.msi"
            .\.github\scripts\build-windows-msi.ps1 -Executable $payload[0].FullName -Version $version -Architecture $architecture -Output $msi -Wix $wix
            $msiPaths += $msi
          }
          $baseChecksums = @(Get-Content -LiteralPath $checksums | Where-Object { $_ -notmatch 'cq_[0-9]+\.[0-9]+\.[0-9]+_windows_(amd64|arm64)\.msi$' })
          foreach ($msi in $msiPaths) {
            $digest = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            $baseChecksums += "$digest  $([IO.Path]::GetFileName($msi))"
          }
          [IO.File]::WriteAllLines($checksums, [string[]]($baseChecksums | Sort-Object), [Text.UTF8Encoding]::new($false))
          gh release upload $env:RELEASE_TAG @msiPaths $checksums --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "failed to publish Windows MSI assets"
          }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          foreach ($architecture in @("amd64", "arm64")) {
            $name = "cq_${version}_windows_${architecture}.msi"
            if (@($release.assets | Where-Object { $_.name -eq $name }).Count -ne 1) {
              throw "published release is missing $name"
            }
          }
