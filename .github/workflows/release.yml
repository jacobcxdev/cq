name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  statuses: read

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, hard-limit failover, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: |
          tests='TestCodexInstalledSupervisorSupportsRemoteCompaction TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover TestCodexInstalledRescuePassesThroughCurrentClient'
          test_log="$RUNNER_TEMP/installed-codex-routing.log"
          if ! CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 -v ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover|TestCodexInstalledRescuePassesThroughCurrentClient)$' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done

  release:
    needs: validate-codex
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Require live Codex routing validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" |
            go run ./internal/tools/releasestatus --sha "${sha}"

      - name: Gate degraded rescue transport
        run: |
          test_name=TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport
          test_log="$RUNNER_TEMP/degraded-rescue-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run "^${test_name}$" >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"

      - name: Gate normal proxy transport
        run: |
          test_name=TestNormalProxyTransportWebSocketHardLimitMigratesBeforeLeak
          test_log="$RUNNER_TEMP/normal-proxy-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run '^TestNormalProxyTransport(HTTP|WebSocket)' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"

      - name: Verify Codex Stage 11 corpus
        run: go test -race -count=1 ./internal/proxy -run '^(TestCodexStage11LifecycleCorpusUsesProductionHandlers|TestCodexStage11LifecycleCorpusSmoke|TestCodexStage11ReviewedManifestMatchesCorpusAuthority)$'

      - name: Bind reviewed Codex corpus provenance
        run: echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go "${GITHUB_REF_NAME#v}" ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)" >> "$GITHUB_ENV"

      - name: Verify Gemini OAuth client secret
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}
        run: test -n "$GEMINI_ANTIGRAVITY_CLIENT_SECRET"

      - name: Build draft release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.GEMINI_ANTIGRAVITY_CLIENT_SECRET }}

      - name: Format draft Homebrew Cask
        run: |
          brew style --fix dist/homebrew/Casks/cq.rb
          brew style dist/homebrew/Casks/cq.rb

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

      - name: Validate Homebrew Cask lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --sort=-v:refname | grep -Fvx "$RELEASE_TAG" | head -1)"
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          current_version="${RELEASE_TAG#v}"
          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=amd64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          previous_root="$RUNNER_TEMP/cq-homebrew-previous"
          mkdir -p "$previous_root"
          gh release download "$previous_tag" \
            --pattern "cq_${previous_version}_darwin_${architecture}.tar.gz" \
            --dir "$previous_root"
          gh api repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb \
            --jq .content | base64 --decode >"$previous_root/cq.rb"
          .github/scripts/validate-homebrew-install.sh \
            "$previous_root/cq.rb" \
            "$previous_root/cq_${previous_version}_darwin_${architecture}.tar.gz" \
            "$previous_version" \
            "$PWD/dist/homebrew/Casks/cq.rb" \
            "$PWD/dist/cq_${current_version}_darwin_${architecture}.tar.gz" \
            "$current_version"

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/cq.rb
          if-no-files-found: error

  windows-packages:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build and publish WinGet MSI assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $releaseRoot = Join-Path $env:RUNNER_TEMP "cq-release"
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern "cq_${version}_windows_*.zip" --pattern "checksums.txt" --dir $releaseRoot
          if ($LASTEXITCODE -ne 0) {
            throw "failed to download Windows release payload"
          }
          $checksums = Join-Path $releaseRoot "checksums.txt"
          dotnet tool install --tool-path $wixRoot wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "failed to install WiX 5.0.2"
          }
          $wix = Join-Path $wixRoot "wix.exe"
          $msiPaths = @()
          foreach ($architecture in @("amd64", "arm64")) {
            $archiveName = "cq_${version}_windows_${architecture}.zip"
            $archive = Join-Path $releaseRoot $archiveName
            $checksumLine = @(Get-Content -LiteralPath $checksums | Where-Object { $_ -match ("  " + [regex]::Escape($archiveName) + '$') })
            if ($checksumLine.Count -ne 1) {
              throw "release checksum is absent or ambiguous for $archiveName"
            }
            $expected = ($checksumLine[0] -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "release checksum differs for $archiveName"
            }
            $payloadRoot = Join-Path $releaseRoot $architecture
            Expand-Archive -LiteralPath $archive -DestinationPath $payloadRoot
            $payload = @(Get-ChildItem -LiteralPath $payloadRoot -Force)
            if ($payload.Count -ne 1 -or $payload[0].Name -ne "cq.exe") {
              throw "Windows release archive has unexpected payload"
            }
            $metadata = & go version -m $payload[0].FullName
            $metadataText = $metadata -join "`n"
            if ($LASTEXITCODE -ne 0 -or $metadataText -notmatch "github.com/jacobcxdev/cq/cmd/cq" -or $metadataText -notmatch ("main.version=" + [regex]::Escape($version)) -or $metadataText -notmatch "GOOS=windows" -or $metadataText -notmatch ("GOARCH=" + [regex]::Escape($architecture))) {
              throw "Windows release binary metadata differs"
            }
            $msi = Join-Path $releaseRoot "cq_${version}_windows_${architecture}.msi"
            .\.github\scripts\build-windows-msi.ps1 -Executable $payload[0].FullName -Version $version -Architecture $architecture -Output $msi -Wix $wix
            $msiPaths += $msi

            $previousRoot = Join-Path $releaseRoot "previous-$architecture"
            New-Item -ItemType Directory -Path $previousRoot -Force | Out-Null
            $previousExecutable = Join-Path $previousRoot "cq.exe"
            $env:GOOS = "windows"
            $env:GOARCH = $architecture
            & go build -ldflags "-X main.version=0.0.1" -o $previousExecutable ./cmd/cq
            Remove-Item Env:GOOS, Env:GOARCH
            if ($LASTEXITCODE -ne 0) {
              throw "failed to build $architecture previous MSI validation payload"
            }
            $previousMSI = Join-Path $releaseRoot "cq_0.0.1_windows_${architecture}.msi"
            .\.github\scripts\build-windows-msi.ps1 -Executable $previousExecutable -Version 0.0.1 -Architecture $architecture -Output $previousMSI -Wix $wix
          }
          $baseChecksums = @(Get-Content -LiteralPath $checksums | Where-Object { $_ -notmatch 'cq_[0-9]+\.[0-9]+\.[0-9]+_windows_(amd64|arm64)\.msi$' })
          foreach ($msi in $msiPaths) {
            $digest = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            $baseChecksums += "$digest  $([IO.Path]::GetFileName($msi))"
          }
          [IO.File]::WriteAllLines($checksums, [string[]]($baseChecksums | Sort-Object), [Text.UTF8Encoding]::new($false))

          $x64MSI = Join-Path $releaseRoot "cq_${version}_windows_amd64.msi"
          $arm64MSI = Join-Path $releaseRoot "cq_${version}_windows_arm64.msi"
          $x64Digest = (Get-FileHash -LiteralPath $x64MSI -Algorithm SHA256).Hash.ToLowerInvariant()
          $arm64Digest = (Get-FileHash -LiteralPath $arm64MSI -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestRoot = Join-Path $releaseRoot "winget"
          $manifestArgs = @(
            "-version", $version,
            "-x64-url", "https://github.com/jacobcxdev/cq/releases/download/v${version}/cq_${version}_windows_amd64.msi",
            "-x64-sha256", $x64Digest,
            "-arm64-url", "https://github.com/jacobcxdev/cq/releases/download/v${version}/cq_${version}_windows_arm64.msi",
            "-arm64-sha256", $arm64Digest,
            "-output", $manifestRoot
          )
          & go run ./internal/tools/wingetmanifest @manifestArgs
          if ($LASTEXITCODE -ne 0) {
            throw "failed to generate WinGet manifests"
          }
          $manifestPath = Join-Path $manifestRoot "manifests\j\jacobcxdev\cq\$version"
          & winget validate --manifest $manifestPath --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet manifest validation failed"
          }
          gh release upload $env:RELEASE_TAG @msiPaths $checksums --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "failed to publish Windows MSI assets"
          }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          foreach ($architecture in @("amd64", "arm64")) {
            $name = "cq_${version}_windows_${architecture}.msi"
            if (@($release.assets | Where-Object { $_.name -eq $name }).Count -ne 1) {
              throw "published release is missing $name"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/cq-release/winget/manifests
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-validation
          path: ${{ runner.temp }}/cq-release/cq_*_windows_*.msi
          if-no-files-found: error

  windows-acceptance:
    needs: windows-packages
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v5
        with:
          name: windows-msi-validation
          path: ${{ runner.temp }}/windows-msi-validation

      - name: Validate native MSI upgrade
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $architecture = switch ($env:PROCESSOR_ARCHITECTURE) {
            "AMD64" { "amd64" }
            "ARM64" { "arm64" }
            default { throw "unsupported Windows architecture $env:PROCESSOR_ARCHITECTURE" }
          }
          $root = Join-Path $env:RUNNER_TEMP "windows-msi-validation"
          $previousMSI = Join-Path $root "cq_0.0.1_windows_${architecture}.msi"
          $currentMSI = Join-Path $root "cq_${version}_windows_${architecture}.msi"
          .\.github\scripts\validate-windows-msi.ps1 -PreviousMSI $previousMSI -CurrentMSI $currentMSI -PreviousVersion 0.0.1 -CurrentVersion $version

  linux-install:
    needs: publish
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate Go runner install, upgrade, transport, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --sort=-v:refname | grep -Fvx "$GITHUB_REF_NAME" | head -1)"
          test -n "$previous_tag"
          .github/scripts/validate-linux-install.sh "$GITHUB_REF_NAME" "$previous_tag"

  publish:
    needs: [release, windows-packages, windows-acceptance]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v5
        with:
          name: homebrew-cask
          path: ${{ runner.temp }}/homebrew-cask

      - name: Publish complete release and Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cask="$RUNNER_TEMP/homebrew-cask/cq.rb"
          test -f "$cask"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq '.assets | length' <<<"$release")" -ge 9
          draft="$(jq -r '.draft' <<<"$release")"
          case "$draft" in
            true) gh release edit "$RELEASE_TAG" --draft=false ;;
            false) echo "Release $RELEASE_TAG already public; resuming publication" ;;
            *) echo "release draft state is invalid: $draft" >&2; exit 1 ;;
          esac

          brew style "$cask"
          endpoint="repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb"
          encoded="$(base64 <"$cask" | tr -d '\n')"
          current="$RUNNER_TEMP/cq-cask-current.json"
          if GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "$endpoint" >"$current" 2>/dev/null; then
            current_content="$(jq -r '.content' "$current" | tr -d '\n')"
            if [[ "$current_content" != "$encoded" ]]; then
              current_sha="$(jq -r '.sha' "$current")"
              GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --method PUT "$endpoint" \
                -f message="chore: updated cq ${RELEASE_TAG}" \
                -f content="$encoded" \
                -f sha="$current_sha"
            fi
          else
            GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --method PUT "$endpoint" \
              -f message="chore: added cq ${RELEASE_TAG}" \
              -f content="$encoded"
          fi

      - name: Audit published Homebrew Cask
        run: |
          brew tap jacobcxdev/tap
          brew update
          brew audit --cask --strict jacobcxdev/tap/cq

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release")" = "false"
          grep -q '^## Changelog$' <<<"$(jq -r '.body' <<<"$release")"
          test "$(jq '.assets | length' <<<"$release")" -ge 9
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            verification_dir="$RUNNER_TEMP/cq-darwin-${arch}"
            mkdir -p "$verification_dir"
            archive="cq_${version}_darwin_${arch}.tar.gz"
            gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$verification_dir"
            tar -xzf "$verification_dir/$archive" -C "$verification_dir"
            go version -m "${verification_dir}/cq" | grep -F "github.com/jacobcxdev/cq/cmd/cq"
          done

  windows-deployed:
    needs: [publish, windows-packages]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v5
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget-manifests

      - name: Validate deployed WinGet and Go runner lifecycle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $manifestPath = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP\winget-manifests -Directory -Recurse | Where-Object { $_.FullName -match "[\\/]j[\\/]jacobcxdev[\\/]cq[\\/]$([regex]::Escape($version))$" })
          if ($manifestPath.Count -ne 1) {
            throw "WinGet manifest directory is absent or ambiguous"
          }
          $validationArguments = @{
            ManifestPath = $manifestPath[0].FullName
            ExpectedVersion = $version
          }
          $previousTag = @(git tag --sort=-v:refname | Where-Object { $_ -ne $env:RELEASE_TAG } | Select-Object -First 1)
          if ($previousTag.Count -ne 1) {
            throw "previous stable tag is absent or ambiguous"
          }
          $previousGoVersion = $previousTag[0].TrimStart("v")
          $validationArguments.PreviousGoVersion = $previousGoVersion
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $packageURL = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/j/jacobcxdev/cq"
          $publishedEntries = @()
          try {
            $publishedEntries = @(Invoke-RestMethod -Uri $packageURL -Headers $headers)
          }
          catch {
            $statusCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($statusCode -ne 404) {
              throw
            }
          }
          $currentSemanticVersion = [version]$version
          $publishedVersions = @()
          foreach ($entry in $publishedEntries) {
            $candidate = $null
            if ($entry.type -eq "dir" -and [version]::TryParse([string]$entry.name, [ref]$candidate) -and $candidate -lt $currentSemanticVersion) {
              $publishedVersions += $candidate
            }
          }
          $previousWinGetVersion = @($publishedVersions | Sort-Object -Descending | Select-Object -First 1)
          if ($previousWinGetVersion.Count -eq 1) {
            $previousVersion = $previousWinGetVersion[0].ToString()
            $previousURL = "$packageURL/$previousVersion"
            $previousEntries = @(Invoke-RestMethod -Uri $previousURL -Headers $headers)
            $previousURLs = @($previousEntries | ForEach-Object { $_.download_url })
            if ($previousURLs.Count -lt 3) {
              throw "previous WinGet manifest is incomplete"
            }
            $previousRoot = Join-Path $env:RUNNER_TEMP "previous-winget-manifest"
            New-Item -ItemType Directory -Path $previousRoot -Force | Out-Null
            foreach ($url in $previousURLs) {
              $name = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
              Invoke-WebRequest -Uri $url -OutFile (Join-Path $previousRoot $name)
            }
            $validationArguments.PreviousManifestPath = $previousRoot
            $validationArguments.PreviousVersion = $previousVersion
          }
          .\.github\scripts\validate-windows-install.ps1 @validationArguments

  winget-publish:
    needs: [windows-deployed, linux-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget-manifests

      - name: Submit WinGet community manifest PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          version="${RELEASE_TAG#v}"
          manifest_dir="$(find "$RUNNER_TEMP/winget-manifests" -type d -path "*/j/jacobcxdev/cq/$version" -print -quit)"
          test -n "$manifest_dir"
          upstream_path="repos/microsoft/winget-pkgs/contents/manifests/j/jacobcxdev/cq/$version"
          if gh api "$upstream_path" >/dev/null 2>&1; then
            echo "WinGet version $version already published"
            exit 0
          fi
          branch="cq-$version"
          existing="$(gh pr list --repo microsoft/winget-pkgs --head "jacobcxdev:$branch" --state open --json url --jq '.[0].url // ""')"
          if [[ -n "$existing" ]]; then
            echo "$existing"
            exit 0
          fi
          if ! gh repo view jacobcxdev/winget-pkgs >/dev/null 2>&1; then
            gh repo fork microsoft/winget-pkgs --clone=false
          fi
          checkout="$RUNNER_TEMP/winget-pkgs"
          gh repo clone jacobcxdev/winget-pkgs "$checkout" -- --filter=blob:none
          git -C "$checkout" remote add upstream https://github.com/microsoft/winget-pkgs.git
          git -C "$checkout" fetch upstream master --depth=1
          git -C "$checkout" fetch origin "$branch" || true
          git -C "$checkout" switch -C "$branch" upstream/master
          destination="$checkout/manifests/j/jacobcxdev/cq/$version"
          mkdir -p "$destination"
          cp "$manifest_dir"/*.yaml "$destination/"
          git -C "$checkout" add "manifests/j/jacobcxdev/cq/$version"
          if git -C "$checkout" diff --cached --quiet; then
            echo "WinGet version $version already matches upstream"
            exit 0
          fi
          git -C "$checkout" -c user.name=jacobcxdev -c user.email=41898282+jacobcxdev@users.noreply.github.com \
            commit -m "New version: jacobcxdev.cq version $version"
          git -C "$checkout" push --force-with-lease origin "$branch"
          gh pr create \
            --repo microsoft/winget-pkgs \
            --base master \
            --head "jacobcxdev:$branch" \
            --assignee jacobcxdev \
            --title "New version: jacobcxdev.cq version $version" \
            --body "Published CQ $version MSI installers for x64 and ARM64."
