name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-vet-test:
    name: Build, vet and race tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: sudo apt-get update && sudo apt-get install -y zsh fish jq
      - run: python3 specs/cli-v2/generate.py --check --go-output internal/cli/catalogue_gen.go
      - run: python3 specs/cli-v2/plan/check.py
      - run: python3 specs/cli-v2/presentation/check.py
      - run: python3 specs/cli-v2/presentation/examples/export.py --check
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
