name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-vet-test:
    name: Build, vet and race tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: bash .github/scripts/test-release-source.sh
      - run: bash .github/scripts/test-release-changelog.sh
      - run: bash .github/scripts/test-package-macos-bundles.sh
      - run: bash .github/scripts/test-close-superseded-winget-prs.sh
      - run: bash .github/scripts/test-ensure-winget-cla.sh
      - run: bash .github/scripts/test-verified-commit.sh
      - run: bash .github/scripts/test-winget-permissions.sh
      - run: bash .github/scripts/test-publish-homebrew-casks.sh
      - run: bash .github/scripts/test-submit-winget-manifest.sh
      - run: bash .github/scripts/test-homebrew-install-companion.sh
