name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness:
    uses: ./.github/workflows/harness.yml

  build-vet-test:
    name: Go build, vet and race tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # The native release preflight fixture fetches from local Git history.
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: bash .github/scripts/test-release-source.sh
      - run: bash .github/scripts/test-prepare-native-ci-release.sh
      - run: bash .github/scripts/test-native-sign-ci.sh
      - run: bash .github/scripts/test-recover-native-notary-request.sh
      - run: bash .github/scripts/test-release-changelog.sh
      - run: bash .github/scripts/test-package-macos-bundles.sh
      - run: bash .github/scripts/test-close-superseded-winget-prs.sh
      - run: bash .github/scripts/test-ensure-winget-cla.sh
      - run: bash .github/scripts/test-verified-commit.sh
      - run: bash .github/scripts/test-winget-permissions.sh
      - run: bash .github/scripts/test-publish-homebrew-casks.sh
      - run: bash .github/scripts/test-submit-winget-manifest.sh
      - run: bash .github/scripts/test-homebrew-install-companion.sh
      - run: bash .github/scripts/test-harness-installed-validator.sh

  qualification:
    name: Build, vet and race tests
    needs: [build-vet-test, harness]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require Go checks and both native harness clients
        env:
          GO_RESULT: ${{ needs.build-vet-test.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
        run: test "$GO_RESULT" = success && test "$HARNESS_RESULT" = success
