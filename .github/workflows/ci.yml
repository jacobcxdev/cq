name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledRescuePassesThroughCurrentClient)$'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - run: go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=arm64 go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - run: go build -o cq.exe ./cmd/cq
      - run: .\cq.exe --help
      - run: .\cq.exe --version
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/aggregate ./internal/auth ./internal/cache ./internal/compat ./internal/fsutil ./internal/history ./internal/httputil ./internal/keyring ./internal/modelregistry ./internal/output ./internal/provider ./internal/provider/claude ./internal/provider/gemini ./internal/quota ./internal/userdirs
      - run: go test -race -count=1 ./internal/app -run '^(TestBuildReport|TestAddProxyEligibility|TestRunner)'
      - run: go test -race -count=1 ./internal/provider/codex -run '^(TestRegistryAccountAliasIndex|TestResolveAccountReference|TestAccountKeyState|TestParseUsage|TestParseNumericResetAt|TestInventoryRejects)'
      - run: go test -race -count=1 ./internal/proxy -run '^(TestConfigRejectsWindowsVolumeRootStateDirectories|TestCodexInstalledProtectedIdentityWindowsUsesFullFileID)$'
      - run: go test -race -count=1 ./cmd/cq -run '^TestProxyStatusRejectsWindowsVolumeRootContinuityDirectory$'
