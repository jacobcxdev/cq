name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the Windows package and service gates
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    if: ${{ !inputs.windows_only }}
    uses: ./.github/workflows/harness.yml

  native-network:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
      - name: Test current native source
        run: swift test --package-path native/macos-network --sanitize thread
      - name: Validate published native packaging fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go test -race -count=1 ./internal/tools/nativepackage
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName |
            jq -er 'map(.tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
          mkdir -p dist/native
          .github/scripts/resolve-native-network.sh "$tag" dist/native/native-network-release.json --published-fixture
          .github/scripts/prepare-native-network.sh dist/native/native-network-release.json dist/native --published-fixture
      - uses: actions/upload-artifact@v7
        with:
          name: native-network-cask
          path: dist/native/*
          if-no-files-found: error
          retention-days: 1

  packages:
    needs: native-network
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
      previous_version: ${{ steps.candidate.outputs.previous_version }}
      current_version: ${{ steps.candidate.outputs.current_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: native-network-cask
          path: dist/native

      - name: Create isolated release candidate tag
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag=
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --sort=-v:refname)
          previous_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"
          test -n "$latest_tag"
          test -n "$previous_tag"
          test "v$(jq -r .version dist/native/native-network-release.json)" = "$previous_tag"
          previous_version="${previous_tag#v}"
          latest_version="${latest_tag#v}"
          IFS=. read -r major minor patch <<<"$latest_version"
          current_version="${major}.${minor}.$((patch + 1))-ci"
          git tag "v$current_version"
          {
            echo "PREVIOUS_TAG=$previous_tag"
            echo "PREVIOUS_VERSION=$previous_version"
            echo "CURRENT_VERSION=$current_version"
            echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go "$current_version" ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)"
            echo "CQ_NATIVE_NETWORK_PIN=$(jq -c . dist/native/native-network-release.json)"
          } >> "$GITHUB_ENV"
          {
            echo "previous_tag=$previous_tag"
            echo "previous_version=$previous_version"
            echo "current_version=$current_version"
          } >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - uses: actions/upload-artifact@v7
        with:
          name: ci-darwin-packages
          path: |
            dist/*_darwin_*.tar.gz
            dist/homebrew/Casks/cq.rb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate-codex:
    needs: [packages, native-network]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Verify companion upgrade and rollback
        run: |
          /bin/bash .github/scripts/test-macos-bundle.sh
          /bin/bash .github/scripts/test-package-macos-bundles.sh
          /bin/bash .github/scripts/test-homebrew-install-companion.sh
          go test -race -count=1 ./cmd/cq -run '^TestHomebrewCompanionReconciliation$'

      - name: Validate normal, compaction, hard-limit failover, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: |
          tests='TestCodexInstalledSupervisorSupportsRemoteCompaction TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover TestCodexInstalledRescuePassesThroughCurrentClient'
          test_log="$RUNNER_TEMP/installed-codex-routing.log"
          if ! CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 -v ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover|TestCodexInstalledRescuePassesThroughCurrentClient)$' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done

      - uses: actions/download-artifact@v8
        with:
          name: ci-darwin-packages
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: native-network-cask
          path: dist/homebrew/Casks

      - name: Install verified native companion dependency for packaging tests
        run: .github/scripts/install-native-network-validation.sh dist/homebrew/Casks/cq-network.rb dist/homebrew/Casks/CQNetwork_*_universal.zip

      - name: Format Homebrew Cask before validation
        run: .github/scripts/format-homebrew-cask.sh dist/homebrew/Casks/cq.rb

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

  homebrew-lifecycle:
    needs: [packages, native-network]
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PREVIOUS_TAG: ${{ needs.packages.outputs.previous_tag }}
      PREVIOUS_VERSION: ${{ needs.packages.outputs.previous_version }}
      CURRENT_VERSION: ${{ needs.packages.outputs.current_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: ci-darwin-packages
          path: dist

      - name: Update Homebrew
        run: brew update

      - uses: actions/download-artifact@v8
        with:
          name: native-network-cask
          path: dist/homebrew/Casks

      - name: Install verified native companion dependency for packaging tests
        run: .github/scripts/install-native-network-validation.sh dist/homebrew/Casks/cq-network.rb dist/homebrew/Casks/CQNetwork_*_universal.zip

      - name: Format Homebrew Cask before validation
        run: .github/scripts/format-homebrew-cask.sh dist/homebrew/Casks/cq.rb

      - name: Validate real Cask install, upgrade, transport, and uninstall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=amd64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          previous_root="$RUNNER_TEMP/cq-homebrew-previous"
          mkdir -p "$previous_root"
          gh api repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb \
            --jq .content | base64 --decode >"$previous_root/cq.rb"
          previous_archive="cq_${PREVIOUS_VERSION}_darwin_${architecture}.tar.gz"
          if grep -Eq '^ *url ".*darwin_.*_bundle.tar.gz"' "$previous_root/cq.rb"; then
            previous_archive="cq_${PREVIOUS_VERSION}_darwin_${architecture}_bundle.tar.gz"
          fi
          gh release download "$PREVIOUS_TAG" --pattern "$previous_archive" --dir "$previous_root"
          .github/scripts/validate-homebrew-install.sh \
            "$previous_root/cq.rb" \
            "$previous_root/$previous_archive" \
            "$PREVIOUS_VERSION" \
            "$PWD/dist/homebrew/Casks/cq.rb" \
            "$PWD/dist/cq_${CURRENT_VERSION}_darwin_${architecture}.tar.gz" \
            "$CURRENT_VERSION" \
            "$PWD/dist/homebrew/Casks/cq-network.rb" \
            "$PWD/dist/homebrew/Casks/$(jq -r '.version | "CQNetwork_\(.)_universal.zip"' dist/homebrew/Casks/native-network-release.json)"

  linux:
    if: ${{ !inputs.windows_only }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - name: Require stock Ubuntu AppArmor policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "${{ matrix.architecture }}"
          test "$(tr -d '\n' </sys/module/apparmor/parameters/enabled)" = Y
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - run: go build ./...
      - run: go vet ./...
      - name: Validate WinGet contributor agreement automation
        run: bash .github/scripts/test-ensure-winget-cla.sh
      - run: bash .github/scripts/test-verified-commit.sh
      - run: bash .github/scripts/test-resolve-native-network.sh
      - run: bash .github/scripts/test-winget-permissions.sh
      - run: bash .github/scripts/test-publish-homebrew-casks.sh
      - run: bash .github/scripts/test-submit-winget-manifest.sh
      - name: Run full race suite and require native transport gates
        shell: bash
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/linux-tests.log"
          # Includes ./internal/installer and ./cmd/cq-install once per architecture.
          if ! go test -race -count=1 ./... -v >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          tests='TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport TestNormalProxyTransportWebSocketHardLimitMigratesBeforeLeak TestLinuxAcceptanceConfinementUsesNamespacesRelaysAndLandlock TestLinuxAcceptanceCancellationReapsDescendants'
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: amd64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - run: .\.github\scripts\test-published-windows-package.ps1

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: go build -o cq.exe ./cmd/cq
      - run: go build -o cq-install.exe ./cmd/cq-install
      - run: .\cq.exe --help
      - run: .\cq.exe --version
      - run: .\cq-install.exe --help
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/fsutil
        if: matrix.architecture == 'amd64'
      - run: go test -race -count=1 ./internal/installer -run '^(TestWindows|TestInstallLock|TestInstaller)'
        if: matrix.architecture == 'amd64'
      - run: go test -race -count=1 ./cmd/cq-install
        if: matrix.architecture == 'amd64'
      - run: go test -race -count=1 ./cmd/cq -run '^(TestWindows|TestRunService|TestServiceSnapshot|TestGrokCommandsManageOnlyCQAccounts|TestZCodeOuterLogin)'
        if: matrix.architecture == 'amd64'
        env:
          CQ_NATIVE_WINDOWS_SCHEDULER_TEST: "1"
      - name: Validate Windows account login and browser behaviour
        if: matrix.architecture == 'amd64'
        run: |
          go test -race -count=1 ./internal/auth
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -race -count=1 ./internal/app -run '^TestWindowsCodexLogin'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -race -count=1 ./internal/provider/codex ./internal/provider/grok ./internal/provider/zai/zcode -run '^TestWindows'
      - name: Validate isolated proxy configuration
        if: matrix.architecture == 'amd64'
        run: go test -race -count=1 ./internal/proxy -run '^(TestConfig|TestSaveConfig|TestLoadExistingConfig|TestRescueBootstrap|TestGeneratedConfig|TestCodexEgressRescue|TestWireGuardConfigurationPersists)'
      - name: Validate per-user MSI install, upgrade, and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CQ_WINDOWS_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = "Stop"
          $architecture = $env:CQ_WINDOWS_ARCHITECTURE
          $version = "0.53.6"
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $wixRoot wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "failed to install WiX 5.0.2" }
          $wix = Join-Path $wixRoot "wix.exe"
          $packages = Join-Path $env:RUNNER_TEMP "cq-msi"
          $previousRoot = Join-Path $packages "previous"
          $currentRoot = Join-Path $packages "current"
          New-Item -ItemType Directory -Path $previousRoot, $currentRoot -Force | Out-Null
          go build -ldflags "-X main.version=0.0.1" -o (Join-Path $previousRoot "cq.exe") ./cmd/cq
          if ($LASTEXITCODE -ne 0) { throw "failed to build previous MSI fixture" }
          $currentExecutable = Join-Path $currentRoot "cq.exe"
          go build -ldflags "-X main.version=$version" -o $currentExecutable ./cmd/cq
          if ($LASTEXITCODE -ne 0) { throw "failed to build current MSI fixture" }
          $previousMSI = Join-Path $packages "cq_0.0.1_windows_${architecture}.msi"
          $currentMSI = Join-Path $packages "cq_${version}_windows_${architecture}.msi"
          .\.github\scripts\build-windows-msi.ps1 -Executable (Join-Path $previousRoot "cq.exe") -Version 0.0.1 -Architecture $architecture -Output $previousMSI -Wix $wix
          .\.github\scripts\build-windows-msi.ps1 -Executable $currentExecutable -Version $version -Architecture $architecture -Output $currentMSI -Wix $wix
          .\.github\scripts\validate-windows-msi.ps1 -PreviousMSI $previousMSI -CurrentMSI $currentMSI -PreviousVersion 0.0.1 -CurrentVersion $version

          $legacyName = "cq_0.53.5_windows_${architecture}.msi"
          $legacyMSI = Join-Path $packages $legacyName
          $legacyPatch = Join-Path $packages "cq_0.53.5_windows_${architecture}_quiet-upgrade.msp"
          gh release download v0.53.5 --repo jacobcxdev/cq --pattern $legacyName --dir $packages
          if ($LASTEXITCODE -ne 0) { throw "failed to download the published 0.53.5 MSI" }
          $quietExecutable = Join-Path $currentRoot "cq-msi-service.exe"
          go build -ldflags "-H=windowsgui -s -w -X main.version=$version" -o $quietExecutable ./cmd/cq
          if ($LASTEXITCODE -ne 0) { throw "failed to build the quiet MSI service helper" }
          .\.github\scripts\build-windows-legacy-patch.ps1 -PreviousMSI $legacyMSI -Executable $quietExecutable -Architecture $architecture -Output $legacyPatch -Wix $wix
          .\.github\scripts\validate-windows-msi.ps1 -PreviousMSI $legacyMSI -CurrentMSI $currentMSI -PreviousVersion 0.53.5 -CurrentVersion $version -LegacyPatch $legacyPatch -VerifyLegacyRollback
      # These tests create the user-local CQ root, which the MSI preflight needs absent.
      - name: Validate isolated Codex routing
        if: matrix.architecture == 'amd64'
        run: go test -race -count=1 ./internal/proxy -run '^(TestCodexInstalledHTTPValidationRuntimeCore|TestCodexInstalledHTTPValidationExercise)'
