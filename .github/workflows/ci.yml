name: CI

on:
  workflow_dispatch:

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, hard-limit failover, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: |
          tests='TestCodexInstalledSupervisorSupportsRemoteCompaction TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover TestCodexInstalledRescuePassesThroughCurrentClient'
          test_log="$RUNNER_TEMP/installed-codex-routing.log"
          if ! CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 -v ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover|TestCodexInstalledRescuePassesThroughCurrentClient)$' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done

      - name: Bind reviewed Codex corpus provenance
        run: echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go 0.0.0 ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

  homebrew-lifecycle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create isolated release candidate tag
        run: |
          set -euo pipefail
          previous_tag=
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --sort=-v:refname)
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          IFS=. read -r major minor patch <<<"$previous_version"
          current_version="${major}.${minor}.$((patch + 1))-ci"
          git tag "v$current_version"
          {
            echo "PREVIOUS_TAG=$previous_tag"
            echo "PREVIOUS_VERSION=$previous_version"
            echo "CURRENT_VERSION=$current_version"
            echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go "$current_version" ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - name: Validate real Cask install, upgrade, transport, and uninstall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=amd64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          previous_root="$RUNNER_TEMP/cq-homebrew-previous"
          mkdir -p "$previous_root"
          gh release download "$PREVIOUS_TAG" \
            --pattern "cq_${PREVIOUS_VERSION}_darwin_${architecture}.tar.gz" \
            --dir "$previous_root"
          gh api repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb \
            --jq .content | base64 --decode >"$previous_root/cq.rb"
          .github/scripts/validate-homebrew-install.sh \
            "$previous_root/cq.rb" \
            "$previous_root/cq_${PREVIOUS_VERSION}_darwin_${architecture}.tar.gz" \
            "$PREVIOUS_VERSION" \
            "$PWD/dist/homebrew/Casks/cq.rb" \
            "$PWD/dist/cq_${CURRENT_VERSION}_darwin_${architecture}.tar.gz" \
            "$CURRENT_VERSION"

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Require stock Ubuntu AppArmor policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "${{ matrix.architecture }}"
          test "$(tr -d '\n' </sys/module/apparmor/parameters/enabled)" = Y
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/installer ./cmd/cq-install
      - name: Gate degraded rescue transport
        run: |
          test_name=TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport
          test_log="$RUNNER_TEMP/degraded-rescue-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run "^${test_name}$" >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"
      - name: Gate normal proxy transport
        run: |
          test_name=TestNormalProxyTransportWebSocketHardLimitMigratesBeforeLeak
          test_log="$RUNNER_TEMP/normal-proxy-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run '^TestNormalProxyTransport(HTTP|WebSocket)' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"
      - name: Gate stock-AppArmor confinement and cleanup
        shell: bash
        run: |
          set -euo pipefail
          tests='TestLinuxAcceptanceConfinementUsesNamespacesRelaysAndLandlock TestLinuxAcceptanceCancellationReapsDescendants'
          test_log="$RUNNER_TEMP/linux-confinement.log"
          if ! go test -race -count=1 -v ./internal/proxy -run '^(TestLinuxAcceptanceConfinementUsesNamespacesRelaysAndLandlock|TestLinuxAcceptanceCancellationReapsDescendants)$' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done
      - run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: go build -o cq.exe ./cmd/cq
      - run: go build -o cq-install.exe ./cmd/cq-install
      - run: .\cq.exe --help
      - run: .\cq.exe --version
      - run: .\cq-install.exe --help
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/fsutil
      - run: go test -race -count=1 ./internal/installer -run '^(TestWindows|TestInstallLock|TestInstaller)'
      - run: go test -race -count=1 ./cmd/cq-install
      - run: go test -race -count=1 ./cmd/cq -run '^(TestWindows|TestRunService|TestServiceSnapshot)'
        env:
          CQ_NATIVE_WINDOWS_SCHEDULER_TEST: "1"
      - run: go test -race -count=1 ./internal/provider/codex -run '^TestWindowsCredential'
      - name: Validate per-user MSI install, upgrade, and uninstall
        shell: pwsh
        run: |
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $wixRoot wix --version 5.0.2
          $wix = Join-Path $wixRoot "wix.exe"
          $packages = Join-Path $env:RUNNER_TEMP "cq-msi"
          $previousRoot = Join-Path $packages "previous"
          $currentRoot = Join-Path $packages "current"
          New-Item -ItemType Directory -Path $previousRoot, $currentRoot -Force | Out-Null
          go build -ldflags "-X main.version=0.0.1" -o (Join-Path $previousRoot "cq.exe") ./cmd/cq
          go build -ldflags "-X main.version=0.0.2" -o (Join-Path $currentRoot "cq.exe") ./cmd/cq
          $previousMSI = Join-Path $packages "cq_0.0.1_windows_amd64.msi"
          $currentMSI = Join-Path $packages "cq_0.0.2_windows_amd64.msi"
          .\.github\scripts\build-windows-msi.ps1 -Executable (Join-Path $previousRoot "cq.exe") -Version 0.0.1 -Architecture amd64 -Output $previousMSI -Wix $wix
          .\.github\scripts\build-windows-msi.ps1 -Executable (Join-Path $currentRoot "cq.exe") -Version 0.0.2 -Architecture amd64 -Output $currentMSI -Wix $wix
          .\.github\scripts\validate-windows-msi.ps1 -PreviousMSI $previousMSI -CurrentMSI $currentMSI -PreviousVersion 0.0.1 -CurrentVersion 0.0.2
