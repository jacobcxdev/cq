name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledRescuePassesThroughCurrentClient)$'

      - name: Bind reviewed Codex corpus provenance
        run: echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go 0.0.0 ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=arm64 go build ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/installer ./cmd/cq-install
      - name: Gate degraded rescue transport
        run: |
          test_name=TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport
          test_log="$RUNNER_TEMP/degraded-rescue-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run "^${test_name}$" >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"
      - run: go test -race -count=1 -skip '^TestLinuxAcceptanceConfinementUsesNamespacesRelaysAndLandlock$' ./...

  linux-confinement:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Permit Linux acceptance namespaces
        run: |
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$setting" ]; then
            value="$(cat "$setting")"
            echo "CQ_APPARMOR_USERNS_ORIGINAL=$value" >> "$GITHUB_ENV"
            echo 0 | sudo tee "$setting" >/dev/null
          fi
      - name: Gate Linux acceptance confinement
        run: go test -race -count=1 ./internal/proxy -run '^TestLinuxAcceptanceConfinementUsesNamespacesRelaysAndLandlock$'
      - run: go test -race -count=1 ./...
      - name: Restore Linux namespace restriction
        if: always()
        run: |
          if [ -n "${CQ_APPARMOR_USERNS_ORIGINAL:-}" ]; then
            echo "$CQ_APPARMOR_USERNS_ORIGINAL" | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build -o cq.exe ./cmd/cq
      - run: go build -o cq-install.exe ./cmd/cq-install
      - run: .\cq.exe --help
      - run: .\cq.exe --version
      - run: .\cq-install.exe --help
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/fsutil
      - run: go test -race -count=1 ./internal/installer -run '^(TestWindows|TestInstallLock|TestInstaller)'
      - run: go test -race -count=1 ./cmd/cq-install
      - run: go test -race -count=1 ./cmd/cq -run '^(TestWindows|TestRunService|TestServiceSnapshot)'
        env:
          CQ_NATIVE_WINDOWS_SCHEDULER_TEST: "1"
