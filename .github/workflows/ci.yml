name: CI

on:
  workflow_dispatch:

jobs:
  validate-codex:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install current Codex client
        run: |
          brew update
          brew install --cask codex
          codex --version

      - name: Validate normal, compaction, hard-limit failover, and rescue routing
        env:
          CQ_RUN_CODEX_TASK_AFFINITY_ACCEPTANCE: "1"
        run: |
          tests='TestCodexInstalledSupervisorSupportsRemoteCompaction TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover TestCodexInstalledRescuePassesThroughCurrentClient'
          test_log="$RUNNER_TEMP/installed-codex-routing.log"
          if ! CQ_CODEX_ACCEPTANCE_EXECUTABLE="$(command -v codex)" go test -race -count=1 -v ./internal/proxy -run '^(TestCodexInstalledSupervisorSupportsRemoteCompaction|TestCodexInstalledTaskAffinityUsesHardLimitOnlyFailover|TestCodexInstalledRescuePassesThroughCurrentClient)$' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          for test_name in $tests; do
            grep -F -- "--- PASS: ${test_name} " "$test_log"
          done

      - name: Bind reviewed Codex corpus provenance
        run: echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go 0.0.0 ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - name: Validate Homebrew Cask quarantine handling
        run: |
          case "$(uname -m)" in
            arm64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_arm64.tar.gz' -print -quit)" ;;
            x86_64) archive="$(find "$PWD/dist" -maxdepth 1 -name 'cq_*_darwin_amd64.tar.gz' -print -quit)" ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -n "$archive"
          .github/scripts/validate-homebrew-cask.sh "$PWD/dist/homebrew/Casks/cq.rb" "$archive"

  homebrew-lifecycle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create isolated release candidate tag
        run: |
          set -euo pipefail
          previous_tag=
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --sort=-v:refname)
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          IFS=. read -r major minor patch <<<"$previous_version"
          current_version="${major}.${minor}.$((patch + 1))-ci"
          git tag "v$current_version"
          {
            echo "PREVIOUS_TAG=$previous_tag"
            echo "PREVIOUS_VERSION=$previous_version"
            echo "CURRENT_VERSION=$current_version"
            echo "CODEX_STAGE11_PROVENANCE_SHA256=$(go run ./.github/scripts/codex-stage11-provenance.go "$current_version" ./internal/proxy/testdata/codex_stage11_reviewed_manifest.json)"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GEMINI_ANTIGRAVITY_CLIENT_SECRET: validation

      - name: Validate real Cask install, upgrade, transport, and uninstall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=amd64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          previous_root="$RUNNER_TEMP/cq-homebrew-previous"
          mkdir -p "$previous_root"
          gh release download "$PREVIOUS_TAG" \
            --pattern "cq_${PREVIOUS_VERSION}_darwin_${architecture}.tar.gz" \
            --dir "$previous_root"
          gh api repos/jacobcxdev/homebrew-tap/contents/Casks/cq.rb \
            --jq .content | base64 --decode >"$previous_root/cq.rb"
          .github/scripts/validate-homebrew-install.sh \
            "$previous_root/cq.rb" \
            "$previous_root/cq_${PREVIOUS_VERSION}_darwin_${architecture}.tar.gz" \
            "$PREVIOUS_VERSION" \
            "$PWD/dist/homebrew/Casks/cq.rb" \
            "$PWD/dist/cq_${CURRENT_VERSION}_darwin_${architecture}.tar.gz" \
            "$CURRENT_VERSION"

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Provide pinned Go path
        run: |
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$(command -v go)" /opt/homebrew/bin/go

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/installer ./cmd/cq-install
      - name: Gate degraded rescue transport
        run: |
          test_name=TestRuntimeSupervisorDegradedRescueRelaysHTTPAndWebSocketOverTransport
          test_log="$RUNNER_TEMP/degraded-rescue-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run "^${test_name}$" >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"
      - name: Gate normal proxy transport
        run: |
          test_name=TestNormalProxyTransportWebSocketHardLimitMigratesBeforeLeak
          test_log="$RUNNER_TEMP/normal-proxy-transport.log"
          if ! go test -race -count=1 -v ./internal/proxy -run '^TestNormalProxyTransport(HTTP|WebSocket)' >"$test_log" 2>&1; then
            cat "$test_log" >&2
            exit 1
          fi
          cat "$test_log"
          grep -F -- "--- PASS: ${test_name} " "$test_log"
      - run: go test -race -count=1 ./...
