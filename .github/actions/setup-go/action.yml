name: Set up Go and caches
description: Install Go and cache modules separately from source-specific compiler outputs.
inputs:
  go-version-file:
    description: File containing the required Go version.
    default: go.mod
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Resolve and retain Go cache paths
      id: paths
      shell: bash
      run: |
        : "${ImageOS:?Hosted runner ImageOS is required}"
        module_cache=$(go env GOMODCACHE)
        build_cache=$(go env GOCACHE)
        {
          echo "image=$ImageOS"
          echo "module-cache=$module_cache"
          echo "build-cache=$build_cache"
        } >> "$GITHUB_OUTPUT"
        {
          echo "GOMODCACHE=$module_cache"
          echo "GOCACHE=$build_cache"
        } >> "$GITHUB_ENV"

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.module-cache }}
        key: cq-go-modules-v1-${{ runner.os }}-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles(inputs.go-version-file, '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum') }}

    - name: Cache Go compiler outputs
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.build-cache }}
        key: cq-go-build-v1-${{ runner.os }}-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles(inputs.go-version-file, '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum') }}-${{ github.job }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum') }}
        restore-keys: |
          cq-go-build-v1-${{ runner.os }}-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles(inputs.go-version-file, '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum') }}-${{ github.job }}-
          cq-go-build-v1-${{ runner.os }}-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles(inputs.go-version-file, '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum') }}-
